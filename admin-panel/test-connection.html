<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Connection Test</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #0a1628;
            color: #fff;
        }
        .container {
            background: #0d1f3c;
            padding: 30px;
            border-radius: 12px;
            border: 1px solid #00d9ff;
        }
        h1 {
            color: #00f5ff;
            margin-top: 0;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: #0a1628;
            border: 2px solid #00d9ff;
            border-radius: 8px;
            color: #00f5ff;
            font-size: 16px;
        }
        button {
            background: #00f5ff;
            color: #0a1628;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #00d9ff;
        }
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }
        .success {
            background: #10b981;
            border: 2px solid #059669;
        }
        .error {
            background: #ef4444;
            border: 2px solid #dc2626;
        }
        .info {
            background: #3b82f6;
            border: 2px solid #2563eb;
        }
        pre {
            background: #000;
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
            font-size: 12px;
        }
        .endpoint {
            background: #0a1628;
            padding: 10px;
            margin: 10px 0;
            border-radius: 8px;
            border-left: 4px solid #00d9ff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔌 Server Connection Test</h1>
        <p>Test your backend server connection before using the admin panel.</p>
        
        <label for="serverUrl"><strong>Server URL:</strong></label>
        <input type="text" id="serverUrl" 
               value="https://adioncode-e5gkh4grbqe4g8b7.centralindia-01.azurewebsites.net"
               placeholder="https://your-server.com">
        
        <div style="margin-top: 20px;">
            <button onclick="testConnection()">🧪 Test Connection</button>
            <button onclick="testAllEndpoints()">🔍 Test All Endpoints</button>
            <button onclick="clearResults()">🗑️ Clear</button>
        </div>
        
        <div id="result" class="result"></div>
    </div>

    <script>
        async function testConnection() {
            const url = document.getElementById('serverUrl').value.trim();
            const resultDiv = document.getElementById('result');
            
            if (!url) {
                showResult('Please enter a server URL', 'error');
                return;
            }
            
            showResult('🔄 Testing connection...', 'info');
            
            try {
                console.log('Testing:', url);
                
                // Test health endpoint
                const response = await fetch(`${url}/api/health`, {
                    method: 'GET',
                    headers: { 'Content-Type': 'application/json' },
                    mode: 'cors',
                });
                
                if (response.ok) {
                    const data = await response.json();
                    showResult(`✅ Connection Successful!
                    
<strong>Server Status:</strong> ${data.status}
<strong>Timestamp:</strong> ${data.timestamp}
<strong>Response Time:</strong> ${response.headers.get('x-response-time') || 'N/A'}

<pre>${JSON.stringify(data, null, 2)}</pre>`, 'success');
                } else {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
            } catch (error) {
                console.error('Connection failed:', error);
                showResult(`❌ Connection Failed

<strong>Error:</strong> ${error.message}

<strong>Possible Causes:</strong>
• Server is not running
• CORS is not enabled
• Wrong URL
• Network/Firewall blocking

<strong>Troubleshooting:</strong>
1. Check if server is running
2. Verify URL is correct
3. Check browser console (F12) for details
4. Try accessing ${url}/api/health directly in browser`, 'error');
            }
        }
        
        async function testAllEndpoints() {
            const url = document.getElementById('serverUrl').value.trim();
            const resultDiv = document.getElementById('result');
            
            if (!url) {
                showResult('Please enter a server URL', 'error');
                return;
            }
            
            showResult('🔄 Testing all endpoints...', 'info');
            
            const endpoints = [
                { name: 'Health Check', path: '/api/health' },
                { name: 'Students', path: '/api/students' },
                { name: 'Teachers', path: '/api/teachers' },
                { name: 'Attendance', path: '/api/attendance/records' },
                { name: 'Timetable', path: '/api/timetable/1/CSE' },
            ];
            
            let results = '<h3>Endpoint Test Results:</h3>';
            let allPassed = true;
            
            for (const endpoint of endpoints) {
                try {
                    const response = await fetch(`${url}${endpoint.path}`, {
                        method: 'GET',
                        headers: { 'Content-Type': 'application/json' },
                        mode: 'cors',
                    });
                    
                    if (response.ok) {
                        results += `<div class="endpoint">✅ <strong>${endpoint.name}</strong>: OK (${response.status})</div>`;
                    } else {
                        results += `<div class="endpoint">⚠️ <strong>${endpoint.name}</strong>: ${response.status} ${response.statusText}</div>`;
                        allPassed = false;
                    }
                } catch (error) {
                    results += `<div class="endpoint">❌ <strong>${endpoint.name}</strong>: ${error.message}</div>`;
                    allPassed = false;
                }
            }
            
            if (allPassed) {
                showResult(results + '<br><strong>✅ All endpoints are working!</strong>', 'success');
            } else {
                showResult(results + '<br><strong>⚠️ Some endpoints failed. Check server logs.</strong>', 'error');
            }
        }
        
        function showResult(message, type) {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = message;
            resultDiv.className = `result ${type}`;
            resultDiv.style.display = 'block';
        }
        
        function clearResults() {
            const resultDiv = document.getElementById('result');
            resultDiv.style.display = 'none';
        }
        
        // Auto-test on load
        window.addEventListener('load', () => {
            console.log('Connection test page loaded');
        });
    </script>
</body>
</html>
